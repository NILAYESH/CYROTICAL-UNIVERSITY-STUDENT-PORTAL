<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
  <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>
    <form id="registerForm" class="space-y-4">
      <div>
        <label for="studentId" class="block mb-1">Student ID</label>
        <input type="text" id="studentId" class="w-full p-2 rounded bg-gray-700 text-white" required>
      </div>
      <div>
        <label for="password" class="block mb-1">Password</label>
        <input type="password" id="password" class="w-full p-2 rounded bg-gray-700 text-white" required>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded">Register</button>
    </form>
    <p class="text-center mt-4 text-sm">
      Already have an account? 
      <a href="login.html" class="text-blue-400 underline">Login here</a>
    </p>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('studentId').value;
      const pwd = document.getElementById('password').value;

      let users = JSON.parse(localStorage.getItem('users')) || {};

      if (users[id]) {
        alert('User already exists. Please login.');
      } else {
        users[id] = pwd;
        localStorage.setItem('users', JSON.stringify(users));
        alert('Registration successful! You can now login.');
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
