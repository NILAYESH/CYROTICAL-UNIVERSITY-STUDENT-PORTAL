<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 4 – LISTS, TABLES & FORMS</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 20px;
    padding: 20px;
    background-color: #142e50;
}
h2 {
    color: #ffffff; 
}

ul, ol {
    background: #ffffff;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 2px 2px 5px rgba(184, 151, 151, 0.848);
}

ul li, ol li {
    margin: 5px 0;
    padding: 5px;
    list-style-position: inside;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    box-shadow: 2px 2px 5px rgb(184, 172, 172);
    margin-top: 20px;
}

thead tr {
    background-color: #333;
    color: white;
    text-align: left;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
}

tbody tr:nth-child(even) {
    background-color: #f9f9f9;
}

tbody tr:hover {
    background-color: #e2e2e2;
}

    </style>
</head>

<body>
    <ul>
        <li>home</li>
        <li>about</li>
    </ul>
    <ol>
        <li>wake up.</li>
        <li>fresh yourself.</li>
        <li>eat breakfast.</li>
        <li>leave for school.</li>
        <li>not forget to keep your lunch box in your bag.</li>
    </ol>
    <table>

            <th>GRADE</th>
        </thead>

            <tr>
                <td>Jatin</td>

                <td>A</td>
            </tr>
            <tr>
                <td>Shivam</td>
                <td>10</td>
                <td>A</td>
            </tr>
            <tr>

                <td>A</td>
            </tr>
            <tr><td>Shubham</td>
            <td>11</td>
        <td>A+</td></tr>
        </tbody>
    </table>
</body>

</html>
