<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div>
        <h2>LOGIN PAGE</h2>
    </div>
    <div>
        <form action="/data.txt"></form>
    </div>
    <div><label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name " required>
    </div>
    <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
    </div>

    <div>
        <label for="tel">Phone</label>
        <input type="tel" id="tel" placeholder="Enter your phone number" required>
    </div>
    <div>
        <label for="pass">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
    </div>
    </div>
    <div><label for="dob">Date of birth</label>
        <input id="dob" type="date" placeholder="Enter your DOB" required>
    </div>
    <div><label for="Gender">Gender</label>
        <select id="Gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
            <option value="not to say">Rather not to say</option>
        </select>
    </div>
    <div>
        <p> Plan</p>
        <input type="radio" name="Subscription" id="basic" value="basic" required>
        <label for="basic">Basic</label>
        <input type="radio" name="Subscription" id="Premium" value="Premium" required>
        <label for="Premium">Premium</label>
        <input type="radio" name="Subscription" id="VIP" value="VIP" required>
        <label for="VIP">VIP</label>
    </div>
    <div>
        <input type="checkbox" name="term" id="term" required>
        <label for="term">I agree to the <a href="/text.html" target="_blank">terms and condition</a>.</label>
    </div>
    <DIV><label for="comments">Comments</label>
        <textarea name="" id="comments">Enter Your Comments</textarea>
    </DIV>
    <div><button type="submit">Submit</button></div>
</body>

</html>
