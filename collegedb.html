<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cdbstyles.css">
    <title>College Login</title>
</head>
<body>
    <header>
        <img src="college-logo.png" alt="College Logo" class="logo">
        <nav>
            <button class="login-btn">Login</button>
            <button class="signup-btn">Sign Up</button>
        </nav>
    </header>

    <main>
        <section class="login-form-section">
            <form id="loginForm">
                <h2>Login</h2>
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Contact Information | Privacy Policy | Terms of Service</p>
    </footer>

    <script src="cdbscript.js"></script>
</body>
</html>
